<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gilded Hedge — a stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a14; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="The Gilded Hedge: sneak past lantern guards, pocket every silver key and slip out the garden gate unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
<script type="module" src="./src/shots.js"></script>
</body>
</html>
